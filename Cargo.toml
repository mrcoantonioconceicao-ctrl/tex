[package]
name = "tex_labs_space_fire"
version = "0.1.0"
edition = "2021"
authors = ["Tex Labs Team <marco@texlabs.space>"]
description = "Enterprise Microgravity Combustion Fire Safety & GraphRAG Engine for NASA Space Apps 2026"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"

[dev-dependencies]
# Testes das rotas HTTP (oneshot do tower). O hyper 0.14 sobrou do axum 0.6 e
# não é mais usado: sai junto com a próxima atualização do Cargo.lock
tower = { version = "0.4", features = ["util"] }
hyper = "0.14"
