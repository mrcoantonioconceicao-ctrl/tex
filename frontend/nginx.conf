# Serve o build estático do Vite e encaminha /api para o backend Axum.
# Mesma origem para tela e API: o navegador não precisa de CORS.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # "tex-backend" é o nome do serviço no docker-compose.yml. Resolvido a cada
    # requisição pelo DNS interno do Docker (127.0.0.11): o nginx sobe mesmo sem
    # o backend (modo mock) e se recupera quando o backend reinicia.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://tex-backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome (index-abc123.js): podem ficar em cache para sempre
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Service worker do MSW (modo mock): nunca em cache
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-cache";
    }

    # SPA: qualquer rota cai no index.html, que nunca fica em cache
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
