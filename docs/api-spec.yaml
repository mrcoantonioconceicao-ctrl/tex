openapi: 3.0.3
info:
  title: Tex Labs - NASA Space Apps 2026 API
  version: 1.0.0
  description: >
    Contrato da API do backend Axum (src/api.rs). É a fonte de verdade para o
    backend e para o frontend (frontend/src/api/types.ts e schemas.ts): mudou
    aqui, muda nos dois lados. A telemetria vem de uma simulação com dados
    SINTÉTICOS (experiment_id SIM-TEX-001), não de dados da NASA.
servers:
  - url: http://localhost:8080/api/v1
    description: Backend direto (cargo run ou docker compose)
  - url: http://localhost:3000/api/v1
    description: Via nginx do frontend (docker compose)
paths:
  /health:
    get:
      summary: Verificação de saúde (usada pelo healthcheck do Docker)
      responses:
        '200':
          description: Servidor no ar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /telemetry/latest:
    get:
      summary: Última leitura da câmara de combustão (atualizada a cada 5 s)
      responses:
        '200':
          description: Leitura atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Telemetry'

  /metrics:
    get:
      summary: Métricas de desempenho dos componentes (últimas medições reais)
      responses:
        '200':
          description: Métricas atuais
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'

  /mcp/context:
    post:
      summary: Contexto técnico otimizado para IA (MCP + GraphRAG + Token Crusher)
      description: >
        Ainda é um stub: devolve um contexto marcado como [SIMULADO] até a
        ingestão do NTRS alimentar a base de conhecimento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: Consulta; vazia ou ausente usa "general_fire_safety"
                  example: supressão de oxigênio
      responses:
        '200':
          description: Contexto gerado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpContext'

  /simulation/suppress:
    post:
      summary: Aciona a supressão manualmente (controle para demo)
      description: A partir do próximo ciclo a temperatura cai 18,5 °C por ciclo até 870 °C.
      responses:
        '200':
          description: Leitura logo após acionar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Telemetry'

  /simulation/reset:
    post:
      summary: Volta a simulação ao estado inicial (controle para demo)
      responses:
        '200':
          description: Leitura inicial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Telemetry'

  /investigations:
    get:
      summary: Catálogo das investigações do PSI (só metadados, sem medições)
      description: >
        Lê experiments e experiment_files (ingestion/db/migrations/0002), com
        origin_category vindo de experiments (0003). Só investigações com
        psi_accession entram. Ordem: número do código PSI, crescente.
        Ranqueamento por ambiente e resumo por IA ficam para depois de 14/11 e
        entram como campos novos, sem quebrar este formato. A fonte é escolhida
        por TEX_CATALOG_SOURCE no backend: synthetic (padrão até 14/11) responde
        com o catálogo sintético PSI-9001 a PSI-9006 (origin_category Synthetic),
        o mesmo dos mocks do frontend; database lê o PostgreSQL a cada requisição.
      parameters:
        - name: program
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Program'
        - name: project_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProjectType'
        - name: q
          in: query
          required: false
          description: Busca sem diferenciar maiúsculas no código, nome, título e objetivo
          schema:
            type: string
            minLength: 1
            maxLength: 200
            example: flame
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Uma página do catálogo (items vazio quando nada casa)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationPage'
        '400':
          description: Parâmetro inválido (programa desconhecido, página fora do limite)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '503':
          $ref: '#/components/responses/CatalogUnavailable'

  /investigations/{accession}:
    get:
      summary: Detalhe de uma investigação do PSI, com a lista de arquivos
      parameters:
        - name: accession
          in: path
          required: true
          schema:
            type: string
            pattern: '^PSI-\d+$'
            example: PSI-25
      responses:
        '200':
          description: Investigação encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Investigation'
        '400':
          description: Código fora do formato PSI-<número>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: Nenhuma investigação com esse código
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '503':
          $ref: '#/components/responses/CatalogUnavailable'

  /investigations/{accession}/runs:
    get:
      summary: Testes de uma investigação do PSI, com condições e medições (PLANEJADO)
      description: >
        Contrato definido antes da implementação. Lê experimental_runs,
        experiment_conditions e measurements, gravados por `npm run
        normalize:psi` a partir das tabelas experimentais (CSV) do PSI. Um item
        = uma linha da tabela da fonte. As condições vêm em unidades comuns
        (O₂ em %, pressão em atm, fluxo em m/s) para comparar investigações;
        as medições ficam na unidade da fonte, sem conversão. Ordem: a da
        tabela de origem. `variables` resume a investigação inteira, não só a
        página. Com TEX_CATALOG_SOURCE=synthetic, só os códigos sintéticos
        PSI-9001 a PSI-9006 respondem, e tudo sai como Synthetic.
      x-status: planned
      parameters:
        - name: accession
          in: path
          required: true
          schema:
            type: string
            pattern: '^PSI-\d+$'
            example: PSI-25
        - name: variable
          in: query
          required: false
          description: >
            Só medições desta variável em cada teste (ex.: o2_final). Os
            testes continuam todos na lista, com measurements vazio quando não
            têm a variável.
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_]*$'
            example: o2_final
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          description: Até 500, para um gráfico caber numa requisição (o SPICE tem 469 testes)
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Uma página de testes (items vazio quando a investigação não tem tabela normalizada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPage'
        '400':
          description: Código fora do formato PSI-<número>, variável ou página inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: Nenhuma investigação com esse código
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '503':
          $ref: '#/components/responses/CatalogUnavailable'

  /conditions/coverage:
    get:
      summary: Faixa de condições testadas por investigação (PLANEJADO)
      description: >
        Contrato definido antes da implementação. Para cada investigação com
        testes normalizados: quantos testes, e o mínimo e o máximo de O₂ (%),
        pressão (atm) e fluxo (m/s) que aparecem em experiment_conditions. Base
        do ranqueamento por ambiente que o enunciado sugere. Ex. (fato do
        enunciado): base lunar e rovers com O₂ de 30% ou mais e 10,2 psi
        (0,694 atm) ou menos → `o2_min=30&pressure_max_atm=0.694`. Com filtro,
        matching_runs conta os testes cuja condição cai inteira no envelope;
        teste sem valor numa dimensão filtrada não conta. Ordem: número do
        código PSI, crescente.
      x-status: planned
      parameters:
        - name: o2_min
          in: query
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 100
        - name: o2_max
          in: query
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 100
        - name: pressure_min_atm
          in: query
          required: false
          schema:
            type: number
            exclusiveMinimum: true
            minimum: 0
        - name: pressure_max_atm
          in: query
          required: false
          schema:
            type: number
            exclusiveMinimum: true
            minimum: 0
        - name: flow_min_ms
          in: query
          required: false
          schema:
            type: number
            minimum: 0
        - name: flow_max_ms
          in: query
          required: false
          schema:
            type: number
            minimum: 0
      responses:
        '200':
          description: Uma linha por investigação com testes normalizados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConditionCoverageList'
        '400':
          description: Limite inválido ou mínimo maior que o máximo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '503':
          $ref: '#/components/responses/CatalogUnavailable'

  /ai/summarize:
    post:
      summary: Resumo por IA dos textos de uma investigação do PSI (PLANEJADO)
      description: >
        Contrato definido antes da implementação: o backend ainda NÃO serve esta
        rota (responde 404 de rota desconhecida) e o frontend usa o mock MSW.
        Provedor de IA, chave e limite de custo entram depois de 14/11, atrás da
        trait Summarizer (src/domain/ai/summarizer.rs). O resumo só reformula
        objective, approach e hypothesis da investigação: não acrescenta
        conclusões físicas e não substitui o texto da fonte. Resumo de modelo
        sai como Inferred; resumo de mock ou de teste, como Synthetic.
      x-status: planned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SummarizeRequest'
      responses:
        '200':
          description: Resumo gerado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSummary'
        '400':
          description: Corpo inválido ou código fora do formato PSI-<número>
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '404':
          description: Nenhuma investigação com esse código
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '422':
          description: >
            Investigação sem objective, approach nem hypothesis
            (code NO_SOURCE_TEXT): não há o que resumir sem inventar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorBody'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  responses:
    CatalogUnavailable:
      description: >
        Fonte database sem resposta do PostgreSQL. A mensagem é genérica; o
        detalhe fica no log do backend.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorBody'
    ServiceUnavailable:
      description: >
        Provedor de IA ou banco sem resposta. A mensagem é genérica; o detalhe
        fica no log do backend.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorBody'
  schemas:
    Health:
      type: object
      required: [status, uptime_seconds, database]
      properties:
        status:
          type: string
          description: '"ok" enquanto o servidor responde, mesmo com o banco fora do ar'
          example: ok
        uptime_seconds:
          type: integer
          minimum: 0
        database:
          type: string
          enum: [up, down, disabled]
          description: >-
            Resultado de um SELECT 1 no PostgreSQL. disabled = servidor sem DATABASE_URL.

    OriginCategory:
      type: string
      enum: [Measured, Published, Derived, Inferred, Synthetic]
      description: >
        Linhagem do dado: Measured (sensor), Published (artigo), Derived (cálculo),
        Inferred (IA), Synthetic (teste/mock/simulação). Único mecanismo de marcação
        de dado sintético. Hoje a telemetria e o contexto são sempre Synthetic.

    RiskLevel:
      type: string
      enum: [NOMINAL, MODERATE_WARNING, CRITICAL_SUPPRESSION_ACTIVE]
      description: >
        NOMINAL até 870 °C; MODERATE_WARNING acima de 870 °C;
        CRITICAL_SUPPRESSION_ACTIVE acima de 900 °C ou com supressão manual.

    Telemetry:
      type: object
      required:
        - experiment_id
        - timestamp
        - sequence
        - chamber_temperature_c
        - oxygen_concentration_pct
        - flame_spread_rate_mm_s
        - risk_level
        - suppression_active
        - origin_category
      properties:
        experiment_id:
          type: string
          example: SIM-TEX-001
        timestamp:
          type: string
          format: date-time
          description: Momento da leitura, RFC 3339 em UTC
          example: '2026-10-19T22:00:00.000Z'
        sequence:
          type: integer
          minimum: 0
          description: Número do ciclo da simulação; volta a 0 no reset
        chamber_temperature_c:
          type: number
          description: Temperatura da câmara em °C (1 casa decimal)
          example: 854.5
        oxygen_concentration_pct:
          type: number
          description: Oxigênio em % (entre 12 e 21)
          example: 21.0
        flame_spread_rate_mm_s:
          type: number
          description: Propagação da chama em mm/s
          example: 1.45
        risk_level:
          $ref: '#/components/schemas/RiskLevel'
        suppression_active:
          type: boolean
        origin_category:
          $ref: '#/components/schemas/OriginCategory'

    Metrics:
      type: object
      required:
        - system_target
        - ast_parsing_latency_us
        - graphrag_query_latency_us
        - token_crusher_efficiency_pct
        - memory_safety_guarantee
        - uptime_status
        - uptime_seconds
      properties:
        system_target:
          type: string
        ast_parsing_latency_us:
          type: integer
          minimum: 0
          description: Latência medida da última validação de leitura
        graphrag_query_latency_us:
          type: integer
          minimum: 0
          description: Latência medida da última consulta MCP (0 antes da primeira)
        token_crusher_efficiency_pct:
          type: number
          description: Redução de tokens da última consulta MCP (0 antes da primeira)
        memory_safety_guarantee:
          type: string
        uptime_status:
          type: string
          example: NOMINAL_ACTIVE
        uptime_seconds:
          type: integer
          minimum: 0

    McpContext:
      type: object
      required: [protocol, status, compressed_context, token_metrics, origin_category]
      properties:
        origin_category:
          $ref: '#/components/schemas/OriginCategory'
        protocol:
          type: string
          example: MCP-Enterprise-v1
        status:
          type: string
          example: ACTIVE_OPTIMIZED
        compressed_context:
          type: string
        token_metrics:
          type: object
          required: [original_estimated_tokens, compressed_tokens, compression_efficiency_pct]
          properties:
            original_estimated_tokens:
              type: integer
            compressed_tokens:
              type: integer
            compression_efficiency_pct:
              type: number

    # ---- Investigações do PSI (tabelas experiments e experiment_files, migração 0002) ----

    Program:
      type: string
      enum: [FLEX, ACME, Saffire, BASS, SAME, DAFT, SPICE, SLICE, CFI, SoFIE, Other]
      description: >
        Mesmo CHECK de experiments.program. Variantes entram no programa-base
        (FLEX-2 → FLEX, BASS-II → BASS); sigla sem programa conhecido vira Other.

    ProjectType:
      type: string
      enum: [Microgravity Investigation, Ground Investigation, Reduced Gravity Investigation]

    InvestigationFile:
      type: object
      required: [category, file_name, file_bytes, sha256, downloaded_at]
      properties:
        category:
          type: string
          example: Experimental table
        file_name:
          type: string
        file_bytes:
          type: integer
          minimum: 0
          nullable: true
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          nullable: true
          description: null enquanto o arquivo não foi baixado e conferido
        downloaded_at:
          type: string
          format: date-time
          nullable: true

    InvestigationSummary:
      type: object
      description: Linha do catálogo. Campos opcionais da fonte chegam como null.
      required:
        - accession
        - name
        - title
        - program
        - project_type
        - sub_research_area
        - hardware
        - start_date
        - end_date
        - file_count
        - origin_category
      properties:
        accession:
          type: string
          pattern: '^PSI-\d+$'
          example: PSI-25
        name:
          type: string
          description: Sigla da investigação; o próprio código quando o PSI não informa
          example: BASS-II
        title:
          type: string
          nullable: true
        program:
          $ref: '#/components/schemas/Program'
        project_type:
          allOf:
            - $ref: '#/components/schemas/ProjectType'
          nullable: true
        sub_research_area:
          type: string
          nullable: true
        hardware:
          type: array
          items:
            type: string
          description: Lista vazia quando o PSI não informa
          example: [Combustion Integrated Rack (CIR)]
        start_date:
          type: string
          format: date
          nullable: true
          example: '2020-01-15'
        end_date:
          type: string
          format: date
          nullable: true
        file_count:
          type: integer
          minimum: 0
        origin_category:
          $ref: '#/components/schemas/OriginCategory'

    Investigation:
      description: >
        Detalhe: o resumo mais os textos da fonte e os arquivos. Os textos são
        os do PSI, sem edição (base do resumo por IA depois de 14/11).
      allOf:
        - $ref: '#/components/schemas/InvestigationSummary'
        - type: object
          required:
            - psi_version
            - objective
            - approach
            - hypothesis
            - doi
            - license
            - total_file_bytes
            - files
            - ingested_at
          properties:
            psi_version:
              type: integer
              minimum: 1
              nullable: true
            objective:
              type: string
              nullable: true
            approach:
              type: string
              nullable: true
            hypothesis:
              type: string
              nullable: true
            doi:
              type: string
              nullable: true
              description: Citação exigida pelo PSI
            license:
              type: string
              nullable: true
              example: CC0-1.0
            total_file_bytes:
              type: integer
              minimum: 0
              nullable: true
            files:
              type: array
              items:
                $ref: '#/components/schemas/InvestigationFile'
            ingested_at:
              type: string
              format: date-time
              nullable: true

    InvestigationPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvestigationSummary'
        total:
          type: integer
          minimum: 0
          description: Total que casa com os filtros (todas as páginas)
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100

    # ---- Testes, condições e medições (planejado; ver /investigations/{accession}/runs) ----

    QualityStatus:
      type: string
      enum: [EXTRACTED, PENDING_VALIDATION, VALIDATED, REJECTED]
      description: >
        Mesmo CHECK de measurements.quality_status. PENDING_VALIDATION = valor
        aproximado na fonte ("~ 21.5"), fora da faixa física esperada ou de
        coluna com dúvida de unidade; a tela deve sinalizar.

    Measurement:
      type: object
      required: [variable, value, unit, elapsed_time_seconds, quality_status, origin_category]
      properties:
        variable:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          example: o2_final
        value:
          type: number
          nullable: true
          description: null = ausente na série; nunca um valor inventado
        unit:
          type: string
          description: 'Unidade da fonte, sem conversão (ex.: %, ppm, mole fraction, mmHg, mg/s)'
          example: '%'
        elapsed_time_seconds:
          type: number
          nullable: true
          description: null nas tabelas de um valor por teste (todas as do PSI hoje)
        quality_status:
          $ref: '#/components/schemas/QualityStatus'
        origin_category:
          $ref: '#/components/schemas/OriginCategory'

    TestConditions:
      type: object
      description: Unidades comuns a todas as investigações; campo que a fonte não traz chega null
      required: [o2_percent, pressure_atm, flow_velocity_ms, diluent, flow_direction]
      properties:
        o2_percent:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: O₂ ambiente em % por volume (fração molar × 100)
        pressure_atm:
          type: number
          nullable: true
        flow_velocity_ms:
          type: number
          minimum: 0
          nullable: true
        diluent:
          type: string
          nullable: true
          example: N2
        flow_direction:
          type: string
          enum: [concurrent, opposed, quiescent, other]
          nullable: true

    SourceFile:
      type: object
      description: Tabela do PSI de onde o teste saiu (rastreabilidade)
      required: [file_name, sha256]
      properties:
        file_name:
          type: string
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'

    ExperimentalRun:
      type: object
      required:
        - test_label
        - run_date
        - sample_description
        - outcome
        - conditions
        - measurements
        - source_file
        - raw
      properties:
        test_label:
          type: string
          description: >
            Rótulo do teste na fonte (ex.: B2). Sem rótulo, ou repetido na
            mesma tabela, vem "registro N" (posição na tabela).
          example: B2
        run_date:
          type: string
          format: date
          nullable: true
        sample_description:
          type: string
          nullable: true
          description: Texto original da amostra ou do combustível
          example: 200 micron PMMA film 2 cm wide
        outcome:
          type: string
          nullable: true
          description: 'Desfecho como a fonte escreve (ex.: Extinction, Disruption)'
        conditions:
          allOf:
            - $ref: '#/components/schemas/TestConditions'
          nullable: true
        measurements:
          type: array
          items:
            $ref: '#/components/schemas/Measurement'
        source_file:
          $ref: '#/components/schemas/SourceFile'
        raw:
          type: object
          additionalProperties:
            type: string
          description: Linha original do CSV, com o cabeçalho da fonte (auditoria)

    VariableSummary:
      type: object
      required: [variable, unit, count, min, max, pending_count]
      properties:
        variable:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        unit:
          type: string
        count:
          type: integer
          minimum: 0
        min:
          type: number
          nullable: true
        max:
          type: number
          nullable: true
        pending_count:
          type: integer
          minimum: 0
          description: Quantas estão como PENDING_VALIDATION

    RunPage:
      type: object
      required: [accession, items, total, page, page_size, variables]
      properties:
        accession:
          type: string
          pattern: '^PSI-\d+$'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExperimentalRun'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 500
        variables:
          type: array
          description: Uma linha por variável e unidade, na investigação inteira (base dos seletores de gráfico)
          items:
            $ref: '#/components/schemas/VariableSummary'

    NumberRange:
      type: object
      required: [min, max]
      properties:
        min:
          type: number
        max:
          type: number

    ConditionCoverage:
      type: object
      required:
        - accession
        - name
        - program
        - run_count
        - o2_percent
        - pressure_atm
        - flow_velocity_ms
        - diluents
        - flow_directions
        - matching_runs
        - origin_category
      properties:
        accession:
          type: string
          pattern: '^PSI-\d+$'
        name:
          type: string
          example: FLEX
        program:
          $ref: '#/components/schemas/Program'
        run_count:
          type: integer
          minimum: 0
        o2_percent:
          allOf:
            - $ref: '#/components/schemas/NumberRange'
          nullable: true
          description: null quando nenhum teste traz o O₂ ambiente
        pressure_atm:
          allOf:
            - $ref: '#/components/schemas/NumberRange'
          nullable: true
        flow_velocity_ms:
          allOf:
            - $ref: '#/components/schemas/NumberRange'
          nullable: true
        diluents:
          type: array
          items:
            type: string
          example: [N2, He, CO2]
        flow_directions:
          type: array
          items:
            type: string
            enum: [concurrent, opposed, quiescent, other]
        matching_runs:
          type: integer
          minimum: 0
          nullable: true
          description: Testes dentro do envelope pedido; null quando não há filtro
        origin_category:
          $ref: '#/components/schemas/OriginCategory'

    ConditionCoverageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConditionCoverage'

    # ---- Resumo por IA (planejado; ver /ai/summarize) ----

    SummarizeRequest:
      type: object
      required: [accession]
      properties:
        accession:
          type: string
          pattern: '^PSI-\d+$'
          example: PSI-25

    AiSummary:
      type: object
      required: [accession, summary, source_fields, model, generated_at, origin_category]
      properties:
        accession:
          type: string
          pattern: '^PSI-\d+$'
        summary:
          type: string
          minLength: 1
        source_fields:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [objective, approach, hypothesis]
          description: Textos da investigação que entraram no resumo (rastreabilidade)
        model:
          type: string
          nullable: true
          description: Identificador do modelo de IA; null quando o resumo é sintético
        generated_at:
          type: string
          format: date-time
        origin_category:
          type: string
          enum: [Inferred, Synthetic]
          description: >
            Subconjunto de OriginCategory: resumo nunca é Published nem Measured.
            Inferred = gerado por modelo; Synthetic = mock ou teste.

    ApiErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [INVALID_PARAMETER, NOT_FOUND, NO_SOURCE_TEXT, SERVICE_UNAVAILABLE]
        message:
          type: string
          description: Texto para quem lê o log; a tela não deve depender dele
