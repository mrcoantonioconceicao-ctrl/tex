name: Simulation CI

# Testa o modelo de predição e confere que o JSON lido pelo painel
# (frontend/src/data/predicoes.json) foi regerado depois da última mudança no modelo.
on:
  push:
    branches: [main]
    paths: ['simulation/**', 'frontend/src/data/**', '.github/workflows/simulation.yml']
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  # Em PR sempre roda; o job abaixo só trabalha se o PR mexer nestes caminhos
  changes:
    uses: ./.github/workflows/changed.yml
    with:
      pattern: '^(simulation/|frontend/src/data/|\.github/workflows/(simulation|changed)\.yml$)'

  simulation:
    needs: changes
    # Se a detecção falhar, roda a CI inteira em vez de pular
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s simulation -v
      - run: python simulation/predicoes.py --check
