name: Docker Stack CI

# Sobe a stack inteira como em desenvolvimento (make up) e confere que ela
# responde (make smoke). Pega Dockerfile quebrado antes do merge.
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'Makefile'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'config/**'
      - 'frontend/**'
      - 'ingestion/**'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'Makefile'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'config/**'
      - 'frontend/**'
      - 'ingestion/**'
      - '.github/workflows/docker.yml'

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build, subir e migrar (make up)
        run: make up
      - name: Smoke test (make smoke)
        run: make smoke
      - name: Logs dos containers
        if: failure()
        run: docker compose logs --no-color
      - name: Derrubar a stack
        if: always()
        run: docker compose down -v
