name: Docker Stack CI

# Sobe a stack inteira como em desenvolvimento (make up) e confere que ela
# responde (make smoke). Pega Dockerfile quebrado antes do merge.
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'Makefile'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'config/**'
      - 'frontend/**'
      - 'ingestion/**'
      - '.github/workflows/docker.yml'
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  # Em PR sempre roda; o job abaixo só trabalha se o PR mexer nestes caminhos
  changes:
    uses: ./.github/workflows/changed.yml
    with:
      pattern: '^(Dockerfile|\.dockerignore|docker-compose\.yml|Makefile|Cargo\.(toml|lock))$|^(src|config|frontend|ingestion)/|^\.github/workflows/(docker|changed)\.yml$'

  stack:
    needs: changes
    # Se a detecção falhar, roda a CI inteira em vez de pular
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build, subir e migrar (make up)
        run: make up
      - name: Smoke test (make smoke)
        run: make smoke
      - name: Logs dos containers
        if: failure()
        run: docker compose logs --no-color
      - name: Derrubar a stack
        if: always()
        run: docker compose down -v
