name: Frontend CI

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  # Em PR sempre roda; o job abaixo só trabalha se o PR mexer nestes caminhos
  changes:
    uses: ./.github/workflows/changed.yml
    with:
      pattern: '^(frontend/|\.github/workflows/(frontend|changed)\.yml$)'

  frontend:
    needs: changes
    # Se a detecção falhar, roda a CI inteira em vez de pular
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
