name: Backend CI

on:
  push:
    branches: [main]
    paths: ['src/**', 'Cargo.toml', 'Cargo.lock', 'config/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['src/**', 'Cargo.toml', 'Cargo.lock', 'config/**', '.github/workflows/backend.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Mesma versão do Dockerfile (rust:1.99-slim-bookworm): atualizar os dois juntos
      - run: rustup toolchain install 1.99 --profile minimal --component rustfmt,clippy && rustup default 1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
