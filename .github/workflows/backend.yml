name: Backend CI

on:
  push:
    branches: [main]
    paths: ['src/**', 'Cargo.toml', 'Cargo.lock', 'config/**', '.github/workflows/backend.yml']
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  # Em PR sempre roda; o job abaixo só trabalha se o PR mexer nestes caminhos
  changes:
    uses: ./.github/workflows/changed.yml
    with:
      pattern: '^(src/|config/|Cargo\.(toml|lock)$|\.github/workflows/(backend|changed)\.yml$)'

  backend:
    needs: changes
    # Se a detecção falhar, roda a CI inteira em vez de pular
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Mesma versão do Dockerfile (rust:1.99-slim-bookworm): atualizar os dois juntos
      - run: rustup toolchain install 1.99 --profile minimal --component rustfmt,clippy && rustup default 1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
