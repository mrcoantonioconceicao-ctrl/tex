name: Ingestion CI

on:
  push:
    branches: [main]
    paths: ['ingestion/**', '.github/workflows/ingestion.yml']
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  # Em PR sempre roda; o job abaixo só trabalha se o PR mexer nestes caminhos
  changes:
    uses: ./.github/workflows/changed.yml
    with:
      pattern: '^(ingestion/|\.github/workflows/(ingestion|changed)\.yml$)'

  ingestion:
    needs: changes
    # Se a detecção falhar, roda a CI inteira em vez de pular
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    # Mesmo banco do docker-compose.yml (credenciais descartáveis, só do CI)
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tex
          POSTGRES_PASSWORD: tex
          POSTGRES_DB: tex
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tex -d tex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tex:tex@localhost:5432/tex
      TEX_TEST_DATABASE_URL: postgres://tex:tex@localhost:5432/tex
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ingestion/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
