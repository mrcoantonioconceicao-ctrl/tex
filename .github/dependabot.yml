# Atualizações automáticas de dependências e imagens base.
# Semanal, com minor/patch agrupados num PR por ecossistema para não poluir o repo.
# Major vem em PR separado: revisar com calma (pode quebrar API).
version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ingestion
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    groups:
      ingestion-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(ci)

  # Imagens base dos Dockerfiles (rust, debian, node, nginx)
  - package-ecosystem: docker
    directories: [/, /frontend, /ingestion]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(docker)
