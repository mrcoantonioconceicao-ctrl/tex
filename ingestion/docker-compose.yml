# PostgreSQL local para desenvolvimento da ingestão.
# Porta 5433 no host para não colidir com outro Postgres na 5432.
# Credenciais só de desenvolvimento local; sobrescreva via variáveis de ambiente.
name: tex-ingestion

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${TEX_DB_USER:-tex}
      POSTGRES_PASSWORD: ${TEX_DB_PASSWORD:-tex}
      POSTGRES_DB: ${TEX_DB_NAME:-tex}
    ports:
      - "127.0.0.1:${TEX_DB_PORT:-5433}:5432"
    volumes:
      - tex_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tex_pgdata:
